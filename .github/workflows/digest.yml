name: Telegram digest

on:
  schedule:
    - cron: '30 5 * * *'   # 08:30 по Москве (UTC+3)
  workflow_dispatch:
    inputs:
      force:
        description: 'Отправить сообщение даже в тихий день'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: node tools/telegram-digest.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_SEND: ${{ github.event.inputs.force == 'true' }}
